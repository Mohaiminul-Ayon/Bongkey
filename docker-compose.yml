services:
  postgres:
    image: postgres:16-alpine
    container_name: bongkey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bongkey
      POSTGRES_USER: bongkey
      POSTGRES_PASSWORD: bongkey_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bongkey -d bongkey"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
